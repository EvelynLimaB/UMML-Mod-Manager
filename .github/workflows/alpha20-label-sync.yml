name: Synchronize alpha20 candidate labels

on:
  push:
    branches:
      - feature/managed-extractor-resilient-gamebanana

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/managed-extractor-resilient-gamebanana
          fetch-depth: 0
      - name: Synchronize current Community Test labels
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          targets = (
              "README.md",
              "MANAGER_README.md",
              "CITATION.cff",
              "docs/README.md",
              "docs/DOWNLOADS.md",
              "docs/PACKAGING.md",
              "docs/RELEASE_PROCESS.md",
              "docs/TESTING_AND_FEEDBACK.md",
              ".github/ISSUE_TEMPLATE/testing_feedback.yml",
              ".github/workflows/manager-testing-release.yml",
              "scripts/build_manager_deb.sh",
              "scripts/build_manager_appimage.sh",
              "scripts/build_manager_frozen.sh",
              "tests/test_release_contract.py",
          )
          replacements = (
              ("0.2.0~alpha19", "0.2.0~alpha20"),
              ("0.2.0-alpha.19", "0.2.0-alpha.20"),
              ("v0.2.0-alpha.19", "v0.2.0-alpha.20"),
              ("0.2.0-alpha.19.md", "0.2.0-alpha.20.md"),
              ("Alpha19", "Alpha20"),
              ("alpha19", "alpha20"),
          )
          for name in targets:
              path = Path(name)
              if not path.is_file():
                  continue
              original = path.read_text(encoding="utf-8")
              updated = original
              for before, after in replacements:
                  updated = updated.replace(before, after)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")

          notes = Path("docs/releases/0.2.0-alpha.20.md")
          text = notes.read_text(encoding="utf-8")
          text = text.replace(
              "## What testers should prioritize",
              "## What to test",
          ).replace(
              "## Reporting feedback",
              "## How to report feedback",
          )
          notes.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          windows_badge = (
              "[![Windows Manager checks](https://github.com/EvelynLimaB/"
              "Uma-Mod-Manager/actions/workflows/manager-windows-checks.yml/"
              "badge.svg)](https://github.com/EvelynLimaB/Uma-Mod-Manager/"
              "actions/workflows/manager-windows-checks.yml)\n"
          )
          download_badges = (
              "[![All release downloads](https://img.shields.io/github/"
              "downloads/EvelynLimaB/Uma-Mod-Manager/total?label=all%20release%"
              "20downloads)](https://github.com/EvelynLimaB/Uma-Mod-Manager/"
              "releases)\n"
              "[![Alpha20 downloads](https://img.shields.io/github/downloads/"
              "EvelynLimaB/Uma-Mod-Manager/v0.2.0-alpha.20/total?label=alpha20%"
              "20downloads)](https://github.com/EvelynLimaB/Uma-Mod-Manager/"
              "releases/tag/v0.2.0-alpha.20)\n"
          )
          if "All release downloads" not in text:
              text = text.replace(
                  windows_badge,
                  windows_badge + download_badges,
                  1,
              )
          start_link = (
              "- [Alpha20 Community Test notes]"
              "(docs/releases/0.2.0-alpha.20.md)\n"
          )
          downloads_link = "- [Download counters](docs/DOWNLOADS.md)\n"
          if downloads_link not in text:
              text = text.replace(
                  start_link,
                  start_link + downloads_link,
                  1,
              )
          readme.write_text(text, encoding="utf-8")

          changelog = Path("MANAGER_CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          if "## 0.2.0~alpha20 - 2026-07-31" not in text:
              heading = "# Uma Mod Manager changelog\n\n"
              section = """## 0.2.0~alpha20 - 2026-07-31

### Managed Veteran extractor packages

- Added direct installation of recognized Werseter/umadump source ZIPs through the Veteran Roster window.
- Added bounded archive validation, hash-addressed immutable tool installs, provider/version provenance, and idempotent re-selection.
- Added private Python 3.14 virtual environments when a compatible interpreter is available, with only upstream-declared requirements installed.
- Added automatic roster import after a successful external extraction while retaining the separate-process, no-bundling, and no-elevation boundaries.

### Resilient GameBanana provider

- Added bounded retries for transient provider failures and a short v11 circuit to avoid repeating the same outage per result.
- Added official Core API detail fallback, Core file-map normalization, and fourteen-day bounded catalogue/detail caches.
- Failed transfers continue to remove partial archives and never enter the immutable mod library.
- Provider failures now explain that no game files changed and retain local archive import as the fallback workflow.

### Feedback and documentation

- Added live total and alpha20 release-asset download badges without adding separate user analytics.
- Added provider, cache, source-ZIP, runtime, privacy, licensing, and testing documentation.
- Added synthetic Windows/Linux regressions for source-package safety, idempotence, API fallback, circuit behavior, cache expiry, and Core file records.

"""
              if not text.startswith(heading):
                  raise SystemExit("Unexpected changelog heading")
              text = heading + section + text[len(heading):]
              changelog.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/alpha20-label-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No label changes were needed."
            exit 0
          fi
          git commit -m "Synchronize alpha20 release metadata"
          git push origin HEAD:feature/managed-extractor-resilient-gamebanana
