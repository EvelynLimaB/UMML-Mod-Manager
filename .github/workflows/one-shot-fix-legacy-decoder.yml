name: One-shot legacy decoder compatibility fix

on:
  push:
    branches:
      - feature/managed-extractor-resilient-gamebanana
    paths:
      - .github/workflows/one-shot-fix-legacy-decoder.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/managed-extractor-resilient-gamebanana
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch decoder lookup and add regression tests
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          adapter = Path('umml_manager/legacy_adapter.py')
          text = adapter.read_text(encoding='utf-8')
          old = '''        decoder = Decoder()
                  decoder.decrypt_assets_internal = types.MethodType(
                      core.UMMLApp.decrypt_assets_internal,
                      decoder,
                  )
                  return decoder
          '''
          new = '''        decoder_host = getattr(core, "UMMLApp", None)
                  if decoder_host is None:
                      decoder_host = getattr(core, "ModLoaderGUI", None)
                  decoder_method = getattr(
                      decoder_host,
                      "decrypt_assets_internal",
                      None,
                  )
                  if decoder_method is None:
                      raise StoreError(
                          "UMML's asset adapter does not expose "
                          "decrypt_assets_internal through UMMLApp or ModLoaderGUI. "
                          "Install a compatible UMML backend or update the Manager."
                      )

                  decoder = Decoder()
                  decoder.decrypt_assets_internal = types.MethodType(
                      decoder_method,
                      decoder,
                  )
                  return decoder
          '''
          if old not in text:
              raise SystemExit('Expected legacy decoder block was not found; refusing an ambiguous patch')
          adapter.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_manager_legacy_decoder_compat.py')
          test.write_text('''from __future__ import annotations

import sys
import types
import unittest
from pathlib import Path
from unittest.mock import patch

from umml_manager.legacy_adapter import LegacyAssetAdapter
from umml_manager.store import StoreError


class LegacyDecoderCompatibilityTests(unittest.TestCase):
    @staticmethod
    def _adapter() -> LegacyAssetAdapter:
        adapter = LegacyAssetAdapter.__new__(LegacyAssetAdapter)
        adapter.meta_path = Path('/tmp/metadata.db')
        return adapter

    @staticmethod
    def _host(result: tuple[int, int]):
        class Host:
            def decrypt_assets_internal(
                self,
                src_root,
                dst_root,
                use_hash=False,
                filter_path=None,
            ):
                self.last_decode = (
                    src_root,
                    dst_root,
                    use_hash,
                    filter_path,
                )
                return result

        return Host

    def _decoder_for(self, **exports):
        core = types.ModuleType('UMML_core')
        for name, value in exports.items():
            setattr(core, name, value)
        with patch.dict(sys.modules, {'UMML_core': core}):
            return self._adapter()._decoder()

    def test_current_modloadergui_backend_is_supported(self):
        decoder = self._decoder_for(ModLoaderGUI=self._host((4, 1)))
        self.assertEqual(
            decoder.decrypt_assets_internal('source', 'target'),
            (4, 1),
        )
        self.assertEqual(
            decoder.last_decode,
            ('source', 'target', False, None),
        )

    def test_historical_ummlapp_backend_remains_supported(self):
        decoder = self._decoder_for(UMMLApp=self._host((2, 0)))
        self.assertEqual(
            decoder.decrypt_assets_internal(
                'source',
                'target',
                use_hash=True,
                filter_path='body',
            ),
            (2, 0),
        )
        self.assertEqual(
            decoder.last_decode,
            ('source', 'target', True, 'body'),
        )

    def test_ummlapp_takes_precedence_when_both_names_exist(self):
        historical = self._host((8, 0))
        current = self._host((9, 0))
        decoder = self._decoder_for(
            UMMLApp=historical,
            ModLoaderGUI=current,
        )
        self.assertEqual(
            decoder.decrypt_assets_internal('source', 'target'),
            (8, 0),
        )

    def test_missing_decoder_api_fails_with_actionable_error(self):
        with self.assertRaisesRegex(
            StoreError,
            'UMMLApp or ModLoaderGUI',
        ):
            self._decoder_for()


if __name__ == '__main__':
    unittest.main()
''', encoding='utf-8')
          PY
          python -m unittest tests.test_manager_legacy_decoder_compat -v
      - name: Commit the real fix and remove this workflow
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-fix-legacy-decoder.yml
          git add umml_manager/legacy_adapter.py tests/test_manager_legacy_decoder_compat.py
          git commit -m "Fix Inspect and edit legacy decoder compatibility"
          git push origin HEAD:feature/managed-extractor-resilient-gamebanana
