name: Temporary trusted responsive page patch

on:
  push:
    branches:
      - feature/managed-extractor-resilient-gamebanana

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/managed-extractor-resilient-gamebanana
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Wire Settings and Studio through scrollable pages
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('umml_manager/gui.py')
          text = path.read_text(encoding='utf-8')
          if 'from .ui_scrolling import ScrollablePage\n' not in text:
              anchor = 'from .ui_library_actions import LibraryActions\n'
              if anchor not in text:
                  raise SystemExit('ScrollablePage import anchor missing')
              text = text.replace(
                  anchor,
                  anchor + 'from .ui_scrolling import ScrollablePage\n',
                  1,
              )
          replacements = (
              (
                  '        self.studio = StudioPage(self.content, self)\n',
                  '        self.studio = ScrollablePage(\n'
                  '            self.content,\n'
                  '            lambda parent: StudioPage(parent, self),\n'
                  '        )\n',
              ),
              (
                  '        self.settings = SettingsPage(self.content, self)\n',
                  '        self.settings = ScrollablePage(\n'
                  '            self.content,\n'
                  '            lambda parent: SettingsPage(parent, self),\n'
                  '        )\n',
              ),
          )
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Responsive page anchor missing: {old!r}')
          path.write_text(text, encoding='utf-8')

          Path('tests/test_manager_responsive_pages.py').write_text(
              '''from __future__ import annotations

import unittest
from pathlib import Path


class ResponsivePageContractTests(unittest.TestCase):
    def test_settings_and_studio_use_scrollable_page_wrapper(self):
        source = Path("umml_manager/gui.py").read_text(encoding="utf-8")
        self.assertIn("from .ui_scrolling import ScrollablePage", source)
        self.assertIn("lambda parent: StudioPage(parent, self)", source)
        self.assertIn("lambda parent: SettingsPage(parent, self)", source)

    def test_library_and_discover_keep_native_table_layouts(self):
        source = Path("umml_manager/gui.py").read_text(encoding="utf-8")
        self.assertIn("self.library = LibraryPage(self.content, self)", source)
        self.assertIn("self.discover = DiscoverPage(self.content, self)", source)


if __name__ == "__main__":
    unittest.main()
''',
              encoding='utf-8',
          )
          PY
          rm -f .github/workflows/one-shot-scroll-settings-studio.yml
      - name: Commit responsive wiring
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add umml_manager/gui.py tests/test_manager_responsive_pages.py
          git add -u .github/workflows
          if git diff --cached --quiet; then
            echo 'Responsive wiring already applied.'
            exit 0
          fi
          git commit -m 'Make Settings and Studio vertically responsive'
          git push origin HEAD:feature/managed-extractor-resilient-gamebanana
