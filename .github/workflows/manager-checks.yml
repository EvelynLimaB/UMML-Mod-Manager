name: Uma Mod Manager Linux checks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'umml_manager/**'
      - 'umml_manager_packaged.py'
      - 'tests/test_manager*.py'
      - 'requirements.txt'
      - 'requirements-build.txt'
      - 'MANAGER_VERSION'
      - 'README.md'
      - 'MANAGER_README.md'
      - 'MANAGER_CHANGELOG.md'
      - 'NOTICE.md'
      - 'CITATION.cff'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'install-manager.sh'
      - 'uninstall-manager.sh'
      - 'scripts/audit_manager.py'
      - 'scripts/check_manager.sh'
      - 'scripts/build_manager_*.sh'
      - 'scripts/manager_main_gate.sh'
      - 'scripts/test_manager_autodetect_runtime.py'
      - 'scripts/test_manager_theme_runtime.py'
      - 'scripts/test_manager_source_install.sh'
      - 'packaging/pyinstaller/umml-manager.spec'
      - 'packaging/linux/io.github.evelynlimab.ummlmanager.*'
      - 'packaging/appimage/io.github.evelynlimab.ummlmanager.desktop'
      - 'assets/umml-manager.svg'
      - '.github/pull_request_template.md'
      - '.github/workflows/manager-checks.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install manager runtime dependencies and metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream-util \
            desktop-file-utils \
            python3-tk \
            xauth \
            xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          python - <<'PY'
          from PIL import Image
          print('Pillow', Image.__version__)
          PY
      - name: Compile every manager Python file
        run: |
          python -m compileall -q \
            umml_manager \
            umml_manager_packaged.py \
            tests \
            scripts/audit_manager.py \
            scripts/test_manager_theme_runtime.py
      - name: Audit source structure and dangerous calls
        run: python scripts/audit_manager.py
      - name: Run manager regression tests
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_manager*.py' -v \
            2>&1 | tee /tmp/umml-manager-tests.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            printf '\n=== FINAL TEST FAILURE CONTEXT ===\n'
            tail -n 180 /tmp/umml-manager-tests.log
          fi
          exit "$status"
      - name: Exercise source install lifecycle and render every GUI page
        run: |
          bash scripts/test_manager_source_install.sh
          python scripts/test_manager_autodetect_runtime.py -- \
            python -m umml_manager
          xvfb-run -a python scripts/test_manager_theme_runtime.py -- \
            python -m umml_manager.gui
      - name: Upload failed manager test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: umml-manager-test-failure-log
          path: /tmp/umml-manager-tests.log
          if-no-files-found: error
          retention-days: 7
      - name: Validate shell and desktop metadata
        run: |
          set +e
          {
            bash -n \
              install-manager.sh \
              uninstall-manager.sh \
              scripts/build_manager_frozen.sh \
              scripts/build_manager_deb.sh \
              scripts/build_manager_appimage.sh \
              scripts/manager_main_gate.sh \
              scripts/test_manager_source_install.sh \
              scripts/check_manager.sh
            desktop-file-validate \
              packaging/linux/io.github.evelynlimab.ummlmanager.desktop \
              packaging/appimage/io.github.evelynlimab.ummlmanager.desktop
            appstream-util validate-relax \
              packaging/linux/io.github.evelynlimab.ummlmanager.metainfo.xml
          } 2>&1 | tee /tmp/umml-manager-metadata-validation.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload failed metadata validation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: umml-manager-metadata-validation-log
          path: /tmp/umml-manager-metadata-validation.log
          if-no-files-found: error
          retention-days: 7

  manager-packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream-util \
            curl \
            desktop-file-utils \
            dpkg-dev \
            file \
            python3-tk \
            xauth \
            xvfb
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m pip check
      - name: Build frozen manager
        run: bash scripts/build_manager_frozen.sh
      - name: Build Debian package
        run: bash scripts/build_manager_deb.sh
      - name: Build AppImage
        run: bash scripts/build_manager_appimage.sh
      - name: Inspect both package formats
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < MANAGER_VERSION)"
          DISPLAY_VERSION="$(printf '%s' "$VERSION" | tr '~' '-')"
          EXPECTED_DEB="dist/umml-manager_${VERSION}_amd64.deb"
          EXPECTED_APPIMAGE="dist/umml-manager_${DISPLAY_VERSION}_x86_64.AppImage"
          DEB="$(find dist -maxdepth 1 -name 'umml-manager_*_amd64.deb' -print -quit)"
          APPIMAGE="$(find dist -maxdepth 1 -name 'umml-manager_*_x86_64.AppImage' -print -quit)"
          test "$DEB" = "$EXPECTED_DEB"
          test "$APPIMAGE" = "$EXPECTED_APPIMAGE"
          test "$(dpkg-deb --field "$DEB" Package)" = 'umml-manager'
          test "$(dpkg-deb --field "$DEB" Version)" = "$VERSION"
          test "$(dpkg-deb --field "$DEB" Architecture)" = 'amd64'
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          file "$APPIMAGE" | grep -q 'ELF 64-bit'
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --cli --help >/dev/null
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --cli self-test
          APPIMAGE_EXTRACT_AND_RUN=1 \
            python scripts/test_manager_autodetect_runtime.py -- \
            "$APPIMAGE" --cli
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a \
            python scripts/test_manager_theme_runtime.py -- \
            "$APPIMAGE"

          build/manager-frozen/umml-manager/umml-manager-bin cli self-test
          python scripts/test_manager_autodetect_runtime.py -- \
            build/manager-frozen/umml-manager/umml-manager-bin cli
          xvfb-run -a python scripts/test_manager_theme_runtime.py -- \
            build/manager-frozen/umml-manager/umml-manager-bin gui

          VERIFY_ROOT="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_ROOT"' EXIT
          mkdir -p "$VERIFY_ROOT/deb"
          dpkg-deb -x "$DEB" "$VERIFY_ROOT/deb"
          (
            cd "$VERIFY_ROOT"
            "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null
          )
          diff -qr \
            build/manager-frozen/umml-manager \
            "$VERIFY_ROOT/deb/usr/lib/umml-manager"
          diff -qr \
            build/manager-frozen/umml-manager \
            "$VERIFY_ROOT/squashfs-root/usr/lib/umml-manager"
          diff -qr \
            "$VERIFY_ROOT/deb/usr/lib/umml-manager" \
            "$VERIFY_ROOT/squashfs-root/usr/lib/umml-manager"
          "$VERIFY_ROOT/deb/usr/lib/umml-manager/umml-manager-bin" \
            cli self-test
          python scripts/test_manager_autodetect_runtime.py -- \
            "$VERIFY_ROOT/deb/usr/lib/umml-manager/umml-manager-bin" cli
          xvfb-run -a python scripts/test_manager_theme_runtime.py -- \
            "$VERIFY_ROOT/deb/usr/lib/umml-manager/umml-manager-bin" gui
          find "$VERIFY_ROOT/deb/usr/lib/umml-manager" \
            -type f -path '*/certifi/cacert.pem' -print -quit | grep -q .
          find "$VERIFY_ROOT/squashfs-root/usr/lib/umml-manager" \
            -type f -path '*/certifi/cacert.pem' -print -quit | grep -q .
          find "$VERIFY_ROOT/deb/usr/lib/umml-manager" \
            -type f -path '*/PIL/_imaging*.so' -print -quit | grep -q .
          find "$VERIFY_ROOT/squashfs-root/usr/lib/umml-manager" \
            -type f -path '*/PIL/_imaging*.so' -print -quit | grep -q .
          test -f "$VERIFY_ROOT/deb/usr/share/doc/umml-manager/NOTICE.md"
          test -f "$VERIFY_ROOT/deb/usr/share/doc/umml-manager/BRANDING_AND_COMPATIBILITY.md"
          test -f "$VERIFY_ROOT/squashfs-root/usr/share/doc/umml-manager/NOTICE.md"
          test -f "$VERIFY_ROOT/squashfs-root/usr/share/doc/umml-manager/BRANDING_AND_COMPATIBILITY.md"
          rm -rf "$VERIFY_ROOT"
          trap - EXIT

          PACKAGE_HOME="$(mktemp -d)"
          trap 'rm -rf "$PACKAGE_HOME"' EXIT
          mkdir -p "$PACKAGE_HOME/data/umml-manager/baseline"
          printf 'preserve\n' \
            > "$PACKAGE_HOME/data/umml-manager/baseline/package-sentinel"
          sudo apt-get install -y "./$DEB"
          test "$(umml-manager-cli --version)" = "$VERSION"
          HOME="$PACKAGE_HOME/home" \
            XDG_DATA_HOME="$PACKAGE_HOME/data" \
            umml-manager-cli self-test
          python scripts/test_manager_autodetect_runtime.py -- \
            umml-manager-cli
          HOME="$PACKAGE_HOME/home" \
            XDG_DATA_HOME="$PACKAGE_HOME/data" \
            umml-manager-cli --root "$PACKAGE_HOME/isolated" list
          HOME="$PACKAGE_HOME/home" \
            XDG_DATA_HOME="$PACKAGE_HOME/data" \
            xvfb-run -a python scripts/test_manager_theme_runtime.py -- \
              umml-manager
          sudo apt-get remove -y umml-manager
          test -f \
            "$PACKAGE_HOME/data/umml-manager/baseline/package-sentinel"
          test "$(cat \
            "$PACKAGE_HOME/data/umml-manager/baseline/package-sentinel")" \
            = preserve
          rm -rf "$PACKAGE_HOME"
          trap - EXIT

          (
            cd dist
            sha256sum \
              "$(basename "$DEB")" \
              "$(basename "$APPIMAGE")" \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: umml-manager-deb
          path: dist/umml-manager_*_amd64.deb
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: umml-manager-appimage
          path: dist/umml-manager_*_x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: umml-manager-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
