name: One-shot Discover UX audit

on:
  push:
    branches:
      - feature/managed-extractor-resilient-gamebanana
    paths:
      - .github/workflows/one-shot-discover-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/managed-extractor-resilient-gamebanana
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply Discover and UI audit patch
        run: python scripts/one_shot_discover_ux.py
      - name: Install test dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Validate patched application
        run: |
          set -Eeuo pipefail
          python -m compileall -q umml_manager tests scripts
          python scripts/audit_manager.py
          python scripts/audit_branding.py
          python scripts/audit_release.py
          python -m unittest discover -s tests -p 'test_manager*.py' -v
          xvfb-run -a python -m umml_manager.gui --smoke-test
      - name: Commit fixes and remove temporary files
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-discover-ux.yml scripts/one_shot_discover_ux.py
          git add umml_manager tests
          git commit -m "Improve automatic Discover loading and UI states"
          git push origin HEAD:feature/managed-extractor-resilient-gamebanana
