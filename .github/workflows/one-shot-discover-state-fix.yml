name: One-shot Discover state fix

on:
  push:
    branches:
      - feature/managed-extractor-resilient-gamebanana
    paths:
      - .github/workflows/one-shot-discover-state-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/managed-extractor-resilient-gamebanana
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/one_shot_discover_state_fix.py
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m compileall -q umml_manager tests scripts
          python scripts/audit_manager.py
          python -m unittest discover -s tests -p 'test_manager*.py' -v
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-discover-state-fix.yml scripts/one_shot_discover_state_fix.py
          git add umml_manager tests
          git commit -m "Harden Discover loading states"
          git push origin HEAD:feature/managed-extractor-resilient-gamebanana
